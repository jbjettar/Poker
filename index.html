<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Campeonato de Poker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Campeonato de Poker</h1>
      <p>Ranking anual por pontuação</p>
    </div>
    <button id="exportBtn">Exportar</button>
  </header>

  <nav>
    <button class="tabBtn active" data-tab="ranking">Ranking</button>
    <button class="tabBtn" data-tab="nova">Nova etapa</button>
    <button class="tabBtn" data-tab="historico">Histórico</button>
    <button class="tabBtn" data-tab="jogadores">Jogadores</button>
  </nav>

  <main>
    <section id="ranking" class="tab active">
      <div class="card">
        <h2>Ranking do ano</h2>
        <div id="rankingList"></div>
      </div>
    </section>

    <section id="nova" class="tab">
      <div class="card">
        <h2>Registrar etapa</h2>
        <label>Data <input id="eventDate" type="date"></label>
        <label>Nome <input id="eventName" placeholder="Ex.: Etapa 17"></label>
        <label class="check"><input id="christmas" type="checkbox"> Poker de Natal — pontos em dobro</label>
      </div>
      <div class="card">
        <h2>Resultados</h2>
        <p class="hint">Compras adicionais não incluem o cacife inicial de R$ 100.</p>
        <div id="resultsForm"></div>
        <button class="primary" id="saveEvent">Salvar etapa</button>
      </div>
    </section>

    <section id="historico" class="tab">
      <div class="card">
        <h2>Histórico</h2>
        <div id="historyList"></div>
      </div>
    </section>

    <section id="jogadores" class="tab">
      <div class="card">
        <h2>Jogadores</h2>
        <div id="playersEdit"></div>
        <button class="primary" id="savePlayers">Salvar jogadores</button>
        <button class="danger" id="resetAll">Apagar tudo</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
